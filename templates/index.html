<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iris Classifier</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6fb; margin: 0; display: flex; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 100%; max-width: 420px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 12px 0 4px; font-size: .9rem; text-transform: capitalize; }
    input { width: 100%; padding: 8px; border: 1px solid #ccd; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 18px; width: 100%; padding: 10px; background: #2b59c3; color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .result { margin-top: 18px; padding: 12px; background: #e8f5e9; border-radius: 6px; }
    .error { margin-top: 18px; padding: 12px; background: #fdecea; border-radius: 6px; }
    small { color: #667; display: block; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Iris Species Classifier</h1>
    <form method="post" action="/predict">
      {% for f in features %}
      <label for="{{ f }}">{{ f.replace('_', ' ') }} (cm)</label>
      <input id="{{ f }}" name="{{ f }}" type="number" step="any" required>
      {% endfor %}
      <button type="submit">Predict</button>
    </form>
    {% if result %}<div class="result">Predicted species: <strong>{{ result }}</strong></div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <small>Endpoints: /health &middot; /metrics</small>
  </div>
</body>
</html>
